spring.application.name=literalura
spring.datasource.url=jdbc:h2:mem:literalura;DB_CLOSE_DELAY=-1;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Nivel de log general
logging.level.root=ERROR

# Nivel de log para Spring específicamente
logging.level.org.springframework=ERROR

# Desactivar banner de Spring
spring.main.banner-mode=off

# Mostrar solo errores de Hibernate/JPA
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

#eliminar logs de hibernate
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionReporter=off



